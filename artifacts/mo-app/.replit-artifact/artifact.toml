kind = "mobile"
previewPath = "/mo-app/"
title = "Mo — AI Voice Assistant"
version = "1.0.0"
id = "artifacts/mo-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mo-app/" ]
localPort = 18361

[services.development]
run = "pnpm --filter @workspace/mo-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mo-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mo-app", "run", "serve" ]

[services.env]
PORT = "18361"
BASE_PATH = "/mo-app/"
