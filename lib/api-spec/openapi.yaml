openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mo AI Voice Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mo
    description: Mo AI voice assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mo/chat:
    post:
      operationId: moChat
      tags: [mo]
      summary: Send a message to Mo
      description: Sends user text to OpenAI and returns Mo's response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Mo's response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mo/speak:
    post:
      operationId: moSpeak
      tags: [mo]
      summary: Convert text to speech via ElevenLabs
      description: Converts the given text to audio using ElevenLabs TTS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakRequest"
      responses:
        "200":
          description: Audio stream (mpeg)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mo/voice:
    post:
      operationId: moVoice
      tags: [mo]
      summary: Full voice pipeline for native mobile
      description: Accepts base64-encoded audio, transcribes, gets Mo reply, synthesizes speech, returns all as JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRequest"
      responses:
        "200":
          description: Transcript, reply text, and base64 audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          description: The user's spoken message
        mode:
          type: string
          enum: [executive, creative, motivational]
          description: The assistant personality mode
          default: executive
      required:
        - message
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: Mo's response text
      required:
        - reply
    SpeakRequest:
      type: object
      properties:
        text:
          type: string
          description: Text to convert to speech
      required:
        - text
    VoiceRequest:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio file
        format:
          type: string
          enum: [m4a, mp4, wav, caf]
          default: m4a
          description: Audio file format
        mode:
          type: string
          enum: [executive, creative, motivational]
          default: executive
          description: The assistant personality mode
      required:
        - audio
    VoiceResponse:
      type: object
      properties:
        transcript:
          type: string
          description: What the user said
        reply:
          type: string
          description: Mo's text response
        audioBase64:
          type: string
          description: Base64-encoded MP3 audio of Mo's reply
      required:
        - transcript
        - reply
        - audioBase64
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
