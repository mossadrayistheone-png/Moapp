name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'API domain (EXPO_PUBLIC_DOMAIN) — your Replit dev or deployed domain'
        required: false
        default: '4f6fb0d5-3605-432b-b4cf-752ffaa27876-00-23fkcbo0ta0v8.spock.replit.dev'
      variant:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      # 4. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 5. Install dependencies
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 6. Run Expo prebuild to generate/refresh artifacts/mo-app/android
      - name: Run Expo prebuild
        working-directory: artifacts/mo-app
        env:
          CI: '1'
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --no-install --clean

      # 7. Verify android project exists
      - name: Verify android project exists
        run: |
          if [ ! -d "artifacts/mo-app/android" ]; then
            echo "ERROR: artifacts/mo-app/android was not created by expo prebuild"
            exit 1
          fi
          echo "OK: artifacts/mo-app/android exists"
          ls artifacts/mo-app/android/

      # 7b. Install stable signing keystore.
      #     expo prebuild --clean generates a brand-new debug.keystore every run.
      #     Android treats a different keystore as a different app, forcing an
      #     uninstall before each update. We overwrite the ephemeral keystore with
      #     a stable one stored as a base64-encoded GitHub secret so that APKs
      #     from successive builds can be installed over each other.
      #
      #     One-time setup (run locally, then add the output as a GitHub secret):
      #       keytool -genkeypair -v -keystore mo-release.keystore \
      #         -alias androiddebugkey -keyalg RSA -keysize 2048 \
      #         -validity 10000 -storepass android -keypass android \
      #         -dname "CN=Mo, OU=Mo, O=Mo, L=Unknown, ST=Unknown, C=US"
      #       base64 -w 0 mo-release.keystore   # → paste value into secret
      #
      #     GitHub secret name: ANDROID_KEYSTORE_BASE64
      #
      #     If the secret is absent (e.g. a fork or first-time setup), the step
      #     warns and falls back to the ephemeral keystore so the build still
      #     succeeds — installs will just continue to require an uninstall.
      - name: Install stable signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Builds will use the ephemeral debug keystore generated by prebuild."
            echo "Each new build will still require an uninstall on-device."
            echo "See docs/android-keystore-setup.md for one-time setup instructions."
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
              > artifacts/mo-app/android/app/debug.keystore
            echo "Stable keystore installed — over-the-air updates enabled."
          fi

      # 8. Write local.properties + restrict to arm64-v8a only.
      #    reactNativeArchitectures is the correct RN 0.71+ way to limit ABIs —
      #    cuts the APK from ~124 MB to ~50 MB by dropping x86/armeabi-v7a libs.
      #    This property is appended AFTER expo prebuild regenerates gradle.properties.
      - name: Write android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > artifacts/mo-app/android/local.properties
          echo "reactNativeArchitectures=arm64-v8a" >> artifacts/mo-app/android/gradle.properties

      # 9. Build APK with Gradle (standard command — no injected ABI flag)
      - name: Build APK
        working-directory: artifacts/mo-app/android
        env:
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          if [ "${{ inputs.variant }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      # 10. Locate and rename APK for a consistent filename.
      #     ABI-split builds output app-arm64-v8a-release.apk not app-release.apk,
      #     so we use find to locate whatever Gradle produced.
      - name: Rename APK
        id: apk
        run: |
          VARIANT="${{ inputs.variant }}"
          DEST="mo-${VARIANT}-build${{ github.run_number }}.apk"
          echo "=== APK outputs ==="
          find artifacts/mo-app/android/app/build/outputs/apk -name "*.apk" | sort
          # Pick the first signed/final APK (skip *-unsigned.apk)
          SRC=$(find "artifacts/mo-app/android/app/build/outputs/apk/${VARIANT}" \
                  -name "*.apk" ! -name "*unsigned*" | sort | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: no APK found in outputs/apk/${VARIANT}/"
            find artifacts/mo-app/android/app/build/outputs/apk -type f | sort
            exit 1
          fi
          echo "Using: $SRC"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      # 11. Upload APK to Replit Object Storage via the API server.
      #     This overwrites a fixed GCS path (apks/mo-latest.apk) on every build,
      #     keeping a single permanent, non-expiring public download URL:
      #       https://<API_DOMAIN>/api/mo/apk
      - name: Upload APK to permanent CDN (Replit Object Storage)
        env:
          API_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
          APK_UPLOAD_TOKEN: ${{ secrets.APK_UPLOAD_TOKEN }}
        run: |
          echo "Uploading APK to https://${API_DOMAIN}/api/mo/apk ..."
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
            -X POST "https://${API_DOMAIN}/api/mo/apk" \
            -H "Authorization: Bearer ${APK_UPLOAD_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${{ steps.apk.outputs.path }}" \
            --max-time 300)
          echo "HTTP status: ${HTTP_STATUS}"
          cat /tmp/upload_response.json
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Upload failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo ""
          echo "-----------------------------------------"
          echo "Permanent download link:"
          echo "https://${API_DOMAIN}/api/mo/apk"
          echo "-----------------------------------------"
          echo ""

      # 12. Also keep the Actions artifact as a backup (30-day retention)
      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mo-${{ inputs.variant }}-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
