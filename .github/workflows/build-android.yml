name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'API domain (EXPO_PUBLIC_DOMAIN) — your Replit dev or deployed domain'
        required: false
        default: '4f6fb0d5-3605-432b-b4cf-752ffaa27876-00-23fkcbo0ta0v8.spock.replit.dev'
      variant:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      # 4. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 5. Install dependencies
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 6. Run Expo prebuild to generate/refresh artifacts/mo-app/android
      - name: Run Expo prebuild
        working-directory: artifacts/mo-app
        env:
          CI: '1'
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --no-install --clean

      # 7. Verify android project exists
      - name: Verify android project exists
        run: |
          if [ ! -d "artifacts/mo-app/android" ]; then
            echo "ERROR: artifacts/mo-app/android was not created by expo prebuild"
            exit 1
          fi
          echo "OK: artifacts/mo-app/android exists"
          ls artifacts/mo-app/android/

      # 8. Write local.properties
      - name: Write android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/mo-app/android/local.properties

      # 9. Build APK with Gradle
      #    -Pandroid.injected.build.abi=arm64-v8a  → only build for arm64 (S24 Ultra).
      #    Cuts the APK from ~124 MB to ~55-65 MB by dropping x86/armeabi-v7a libs.
      - name: Build APK
        working-directory: artifacts/mo-app/android
        env:
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          if [ "${{ inputs.variant }}" = "debug" ]; then
            ./gradlew :app:assembleDebug \
              -Pandroid.injected.build.abi=arm64-v8a \
              --no-daemon
          else
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.build.abi=arm64-v8a \
              --no-daemon
          fi

      # 10. Locate and rename APK for a consistent filename.
      #     ABI-split builds output app-arm64-v8a-release.apk not app-release.apk,
      #     so we use find to locate whatever Gradle produced.
      - name: Rename APK
        id: apk
        run: |
          VARIANT="${{ inputs.variant }}"
          DEST="mo-${VARIANT}-build${{ github.run_number }}.apk"
          echo "=== APK outputs ==="
          find artifacts/mo-app/android/app/build/outputs/apk -name "*.apk" | sort
          # Pick the first signed/final APK (skip *-unsigned.apk)
          SRC=$(find "artifacts/mo-app/android/app/build/outputs/apk/${VARIANT}" \
                  -name "*.apk" ! -name "*unsigned*" | sort | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: no APK found in outputs/apk/${VARIANT}/"
            find artifacts/mo-app/android/app/build/outputs/apk -type f | sort
            exit 1
          fi
          echo "Using: $SRC"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      # 11. Delete old 'latest' release if it exists, then recreate
      #     This keeps a single always-current download link:
      #     https://github.com/<owner>/<repo>/releases/download/latest/<apk-name>
      - name: Delete existing 'latest' release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Mo — Latest Build (#${{ github.run_number }})" \
            --notes "**Build #${{ github.run_number }}** — variant: \`${{ inputs.variant }}\`
          Commit: \`${{ github.sha }}\`
          Domain: \`${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}\`

          Install on your device:
          1. Download the APK below
          2. Open it on your Android device (allow installs from unknown sources)
          3. Uninstall any previous Mo build first if prompted about signature mismatch" \
            --prerelease \
            "${{ steps.apk.outputs.path }}"

      # 12. Print the direct download URL
      - name: Print download URL
        run: |
          echo ""
          echo "========================================="
          echo "Direct download link:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest/${{ steps.apk.outputs.name }}"
          echo "========================================="
          echo ""

      # 13. Also keep the Actions artifact as a backup (30-day retention)
      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mo-${{ inputs.variant }}-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
