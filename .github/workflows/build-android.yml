name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'API domain (EXPO_PUBLIC_DOMAIN) — your Replit dev or deployed domain'
        required: false
        default: '4f6fb0d5-3605-432b-b4cf-752ffaa27876-00-23fkcbo0ta0v8.spock.replit.dev'
      variant:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      # 4. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 5. Install dependencies
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 6. Run Expo prebuild to generate/refresh artifacts/mo-app/android
      - name: Run Expo prebuild
        working-directory: artifacts/mo-app
        env:
          CI: '1'
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --no-install --clean

      # 7. Verify android project exists
      - name: Verify android project exists
        run: |
          if [ ! -d "artifacts/mo-app/android" ]; then
            echo "ERROR: artifacts/mo-app/android was not created by expo prebuild"
            exit 1
          fi
          echo "OK: artifacts/mo-app/android exists"
          ls artifacts/mo-app/android/

      # 8. Write local.properties
      - name: Write android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/mo-app/android/local.properties

      # 9. Build APK with Gradle
      - name: Build APK
        working-directory: artifacts/mo-app/android
        env:
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          if [ "${{ inputs.variant }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      # 10. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mo-${{ inputs.variant }}-build-${{ github.run_number }}
          path: |
            artifacts/mo-app/android/app/build/outputs/apk/release/app-release.apk
            artifacts/mo-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
