name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'API domain (EXPO_PUBLIC_DOMAIN) — your Replit dev or deployed domain'
        required: false
        default: '4f6fb0d5-3605-432b-b4cf-752ffaa27876-00-23fkcbo0ta0v8.spock.replit.dev'
      variant:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Write android/local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/mo-app/android/local.properties

      - name: Build APK
        working-directory: artifacts/mo-app/android
        env:
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          if [ "${{ inputs.variant }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mo-${{ inputs.variant }}-build-${{ github.run_number }}
          path: |
            artifacts/mo-app/android/app/build/outputs/apk/release/app-release.apk
            artifacts/mo-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
